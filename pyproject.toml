[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "swarkavach"
version = "1.0.0"
description = "Voice-clone fraud call detection for Hinglish telephony: acoustic anti-spoofing fused with scam-intent NLP"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Bhavye Nijhawan" }]
keywords = ["anti-spoofing", "audio-deepfake", "fraud-detection", "code-mixed", "hinglish", "nlp", "speech"]

dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "torch>=2.1",
    "Flask>=3.0",
    "PyYAML>=6.0",
    "typer>=0.9",
    "rich>=13.0",
    "tqdm>=4.66",
    "joblib>=1.3",
]

[project.optional-dependencies]
audio = ["soundfile>=0.12"]
colab = [
    "openai-whisper",
    "transformers>=4.40",
    "datasets>=2.18",
    "accelerate",
    "sentencepiece",
    "sklearn-crfsuite>=0.3.6",
    "edge-tts>=6.1",
]

[project.scripts]
swarkavach = "swarkavach.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
swarkavach = ["py.typed"]
